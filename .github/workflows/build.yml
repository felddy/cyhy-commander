---
name: Build

on:  # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - develop
      - develop-*
  release:
    types:
      - edited
      - published
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    # yamllint disable-line rule:line-length
    uses: felddy/reusable-workflows/.github/workflows/diagnostics.yml@76486c28caa391f5f9db4941fc555a20a6e084c8  # tag=v4.2.0

  lint:
    # yamllint disable-line rule:line-length
    uses: felddy/reusable-workflows/.github/workflows/common-lint.yml@76486c28caa391f5f9db4941fc555a20a6e084c8  # tag=v4.2.0

  config:
    uses: ./.github/workflows/_config.yml

  source-test:
    needs:
      - config
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen --group test
      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=cyhy_commander
          --cov-report=term-missing
          --cov-fail-under=80

  build:
    needs:
      - config
      - diagnostics
      - lint
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # yamllint disable-line rule:line-length
    uses: felddy/reusable-workflows/.github/workflows/container-build.yml@76486c28caa391f5f9db4941fc555a20a6e084c8  # tag=v4.2.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.platforms }}

  container-test:
    needs:
      - config
      - build
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.test_platforms) }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image reference and pull
        env:
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_SLUG=$(echo "${IMAGE_NAME}" | tr '/' '-')
          PLATFORM_SLUG=$(echo "${PLATFORM}" | tr '/' '-')
          ARTIFACT_NAME="digests-${IMAGE_SLUG}-${PLATFORM_SLUG}"
          ARTIFACT_DIR="/tmp/digests/${ARTIFACT_NAME}"

          echo "Downloading artifact: ${ARTIFACT_NAME}"
          mkdir -p /tmp/digests
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${ARTIFACT_NAME}" \
            --dir "${ARTIFACT_DIR}"

          HEX=$(ls "${ARTIFACT_DIR}" | grep -E '^[a-f0-9]{64}$' || true)
          if [[ -z "${HEX}" ]]; then
            echo "::error::No valid sha256 digest file found in ${ARTIFACT_DIR}"
            exit 1
          fi

          IMAGE_REF="ghcr.io/${IMAGE_NAME}@sha256:${HEX}"
          echo "Pulling ${IMAGE_REF} (platform: ${PLATFORM})"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" test-image:latest
      - name: Install container-structure-test
        run: |
          CST_BASE="https://github.com/GoogleContainerTools"
          CST_BIN="container-structure-test-linux-amd64"
          CST_PATH="releases/latest/download/${CST_BIN}"
          curl -LO "${CST_BASE}/container-structure-test/${CST_PATH}"
          chmod +x "${CST_BIN}"
          sudo mv "${CST_BIN}" /usr/local/bin/container-structure-test
      - name: Run container structure tests
        run: |
          container-structure-test test \
            --image test-image:latest \
            --config tests/container-structure-test.yaml

  publish-manifest:
    needs:
      - config
      - build
      - source-test
      - container-test
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # yamllint disable-line rule:line-length
    uses: felddy/reusable-workflows/.github/workflows/container-publish-manifest.yml@76486c28caa391f5f9db4941fc555a20a6e084c8  # tag=v4.2.0
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.platforms }}
